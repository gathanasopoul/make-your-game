name: Make Your Game CI/CD

on:
  push:
    branches:
      - main
      - master
      - feature/**
  pull_request:
    branches:
      - main
      - master
      - feature/**

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: Lint JavaScript
        run: npm run lint

      - name: Run Tests
        run: npm run test

      - name: Build Docker Image (Dry Run / Validation)
        run: |
          docker build -t make-your-game:latest .
