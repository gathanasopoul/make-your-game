<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Make Your Game</title>

    <link rel="stylesheet" href="/css/style.css">
</head>

<body>

    <!-- Main game container -->
    <div id="game-container">
        <!-- HUD -->
        <div id="game-hud">
            <div class="hud-item">RECOVERED: <span id="score-value">0</span>MB</div>
            <div class="hud-item">INTEGRITY: <span id="integrity-value">100</span>%</div>
            <div class="hud-item">TIME: <span id="timer-value">60</span>s</div>
        </div>
        <div id="game-world"></div>
    </div>

    <script type="module" src="/js/main.js"></script>

</body>

</html>
